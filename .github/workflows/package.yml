name: OCI package

on:
  pull_request:
    paths:
      - '.github/workflows/package.yml'
      - 'packaging/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the tested v0.1.0-alpha.1 Linux amd64 package to GHCR'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: oci-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_REVISION: 7a0600ecd84bc32c817d9cb55d6d59976d2331e9
  PACKAGE_VERSION: v0.1.0-alpha.1
  PACKAGE_IMAGE: ghcr.io/felixstudio-dev/apply-correction-php2shell

jobs:
  build:
    name: Test and build Linux amd64 distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out packaging
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tooling
          persist-credentials: false
      - name: Check out the immutable application revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_REVISION }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          check-latest: false
          cache: false
      - name: Test, package and validate the distribution image
        env:
          GOTOOLCHAIN: local
        run: bash tooling/packaging/build.sh "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/oci-package"
      - name: Preserve only verified package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-package
          path: |
            ${{ runner.temp }}/oci-package/output/image.tar
            ${{ runner.temp }}/oci-package/output/image.tar.sha256
            ${{ runner.temp }}/oci-package/output/receipt.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified OCI package
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'felixstudio-dev/apply-correction-PHP2Shell'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out publishing checks
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download this run's verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oci-package
          path: package-artifact
      - name: Publish without overwriting a version and verify the registry result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CONFIG: ${{ runner.temp }}/php2shell-docker-auth
        run: bash packaging/publish.sh "$GITHUB_WORKSPACE/package-artifact"
      - name: Remove temporary registry login
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/php2shell-docker-auth
        run: |
          docker logout ghcr.io || true
          rm -rf -- "$DOCKER_CONFIG"
      - name: Preserve public registry verification metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-registry-receipt
          path: package-artifact/registry-receipt.json
          if-no-files-found: ignore
          retention-days: 7
